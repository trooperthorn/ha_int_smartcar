# Runs the pytest suite with the 100 percent coverage gate and the pre-commit
# lint set on every push and pull request. release.yml calls this workflow so
# the same jobs gate every GitHub Release.
name: Pytest

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.test.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.test.txt
      - name: Verify runtime versions
        run: >-
          python -c "from importlib.metadata import version; import sys;
          assert version('homeassistant') == '2026.9.2';
          assert sys.version_info[:2] == (3, 14)"
      - name: Test with pytest
        run: pytest -p no:sugar
      - name: Validate coverage
        run: coverage json -q -o - | python3 .github/validate_coverage.py
      - name: Validate the release version fields
        run: python3 scripts/build_release_artifacts.py --validate-only

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.test.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.test.txt
      - name: Test with pre-commit
        run: SKIP=no-commit-to-branch pre-commit run -a
