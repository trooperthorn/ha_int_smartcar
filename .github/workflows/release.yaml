name: "Release"

on:
  release:
    types: ["published"]
  # so an asset can be rebuilt for a release that already exists, without
  # deleting and recreating the release to fire the event again.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build the asset for"
        required: true
        type: string

permissions:
  contents: write

jobs:
  asset:
    name: "Prepare release asset"
    runs-on: "ubuntu-latest"
    env:
      TAG: "${{ inputs.tag || github.ref_name }}"
    steps:
      - name: "Check out the tag"
        uses: "actions/checkout@v4"
        with:
          ref: "${{ inputs.tag || github.ref_name }}"

      # the tag is the version. HACS installs the release asset and reads the
      # manifest inside it, so the two have to agree: a mismatch shows up as
      # an update that never settles.
      - name: "Set manifest version number"
        run: |
          python3 .github/update_hacs_manifest.py --version "${TAG#v}"

      - name: "Create zip"
        run: |
          cd custom_components/smartcar
          zip -r smartcar.zip ./ -x 'smartcar.zip' '__pycache__/*'

      # gh is first party and already authenticated here. the third party
      # upload action this replaced was pinned to a moving tag.
      - name: "Upload zip to release"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          gh release upload "${TAG}" \
            custom_components/smartcar/smartcar.zip --clobber
