# Static and dependency security checks on every push and pull request plus a
# weekly run for new advisories. There is no frontend bundle and no companion
# app in this repository, so the JavaScript, ShellCheck, and container image
# jobs of the baseline are not present.
name: Security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@d8073367669608af8fbcc5f63dd0a0d52bb90cff # v4
        with:
          category: "/language:${{ matrix.language }}"

  python-security:
    name: Python static security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pinned scanner
        run: pip install "bandit==1.8.6"
      - name: Compile Python
        run: python -m compileall -q custom_components scripts
      - name: Bandit medium/high findings
        run: bandit -q -r custom_components/smartcar scripts -ll
