blueprint:
  name: Smartcar - left unlocked away from home
  description: >-
    Notifies when the car is away from home and unlocked for a while, with a
    Lock action on the notification.


    Reading the lock state costs nothing; it is the entity Home Assistant
    already has. Locking it is one Smartcar command
    (`smartcar.lock_doors`), billed from the same 500 calls per vehicle per
    month allowance as everything else. Because a command can matter more
    than a reading, this respects an API reserve: if the API calls remaining
    sensor is below the reserve you set, it still notifies but skips the Lock
    action and says the reserve is protecting it, rather than silently
    failing when you tap it.
  domain: automation
  homeassistant:
    min_version: 2026.9.0
  input:
    vehicle_tracker:
      name: Vehicle location
      selector:
        entity:
          filter:
            - domain: device_tracker
              integration: smartcar
    door_lock:
      name: Door lock
      selector:
        entity:
          filter:
            - domain: lock
              integration: smartcar
    config_entry:
      name: Smartcar account
      selector:
        config_entry:
          integration: smartcar
    api_remaining:
      name: API calls remaining sensor
      selector:
        entity:
          filter:
            - domain: sensor
              integration: smartcar
    reserve:
      name: API call reserve
      description: >-
        Below this many calls remaining, the Lock action is left off the
        notification instead of being offered and then failing.
      default: 50
      selector:
        number:
          min: 0
          max: 400
          step: 5
    settle:
      name: Unlocked for
      default:
        minutes: 15
      selector:
        duration: {}
    notify_target:
      name: Notify action (deprecated)
      description: >-
        Optional legacy notify action, for example notify.mobile_app_phone.
        Still called if set, for existing automations. New setups should use
        Notify devices below instead.
      default: ""
      selector:
        text: {}
    notify_devices:
      name: Notify devices
      description: >-
        Mobile app devices to notify. Each device's notify action is derived
        as notify.mobile_app_<device name, slugified>.
      default: []
      selector:
        device:
          filter:
            - integration: mobile_app
          multiple: true
    also_persistent:
      name: Also create a persistent notification
      description: >-
        In addition to the devices above, also raises a persistent_notification
        with the same title and message. On by default so a fresh import
        behaves like the old default of notify.persistent_notification did.
      default: true
      selector:
        boolean: {}
    lock_action_id:
      name: Lock action ID
      description: >-
        The action ID sent with the "Lock" notification button, and the
        one this blueprint listens for. Must be unique per vehicle if this
        blueprint is used for more than one car, otherwise tapping "Lock"
        on one car's notification also fires the other car's automation.
      default: SMARTCAR_LOCK_DOORS
      selector:
        text: {}
    notification_tag:
      name: Notification tag
      description: >-
        A stable, per-vehicle tag so a repeat of this notification replaces
        the previous one instead of stacking. Use a different value per
        vehicle if this blueprint is used for more than one car.
      default: smartcar_left_unlocked
      selector:
        text: {}
    notification_channel:
      name: Notification channel
      default: Smartcar
      selector:
        text: {}
    notification_importance:
      name: Notification importance
      default: high
      selector:
        select:
          options:
            - min
            - low
            - default
            - high
            - max
    notification_icon:
      name: Notification icon
      default: "mdi:lock-open-variant"
      selector:
        text: {}
    click_action:
      name: Click action
      description: >-
        Where tapping the notification body opens. A Home Assistant path
        such as "/config/devices/device/<id>" for the vehicle's device
        page, or "entityId:sensor.xxx" for an entity's more-info dialog.
        Leave blank for the default behavior.
      default: ""
      selector:
        text: {}
    announce_tts:
      name: Also announce with text-to-speech
      description: >-
        When on, also sends the notification text to the same notify
        action as a spoken TTS command, in addition to the normal
        notification.
      default: false
      selector:
        boolean: {}

mode: queued
max: 5
max_exceptions: 0

triggers:
  - trigger: state
    id: unlocked_away
    entity_id: !input door_lock
    to: unlocked
    for: !input settle
  - trigger: state
    id: locked
    entity_id: !input door_lock
    to: locked
  - trigger: event
    id: lock_action
    event_type: mobile_app_notification_action
    event_data:
      action: !input lock_action_id

conditions: []

actions:
  - variables:
      remaining_entity: !input api_remaining
      reserve_value: !input reserve
      config_entry_id: !input config_entry
      announce_tts: !input announce_tts
      notify_target: !input notify_target
      notify_devices: !input notify_devices
      also_persistent: !input also_persistent
      has_budget: >-
        {{ (states(remaining_entity) | int(0)) > reserve_value }}
  - choose:
      - conditions:
          - condition: trigger
            id: lock_action
        sequence:
          - action: smartcar.lock_doors
            data:
              config_entry: !input config_entry
            continue_on_error: true
      - conditions:
          - condition: trigger
            id: locked
        sequence:
          - repeat:
              for_each: "{{ notify_devices }}"
              sequence:
                - action: >-
                    notify.mobile_app_{{
                      device_attr(repeat.item, 'name') | slugify }}
                  data:
                    message: clear_notification
                    data:
                      tag: !input notification_tag
          - if:
              - condition: template
                value_template: "{{ notify_target | trim != '' }}"
            then:
              - action: !input notify_target
                data:
                  message: clear_notification
                  data:
                    tag: !input notification_tag
      - conditions:
          - condition: trigger
            id: unlocked_away
          - condition: not
            conditions:
              - condition: state
                entity_id: !input vehicle_tracker
                state: home
          - condition: template
            value_template: "{{ has_budget }}"
        sequence:
          - variables:
              unlocked_message: >-
                The car has been away and unlocked for a while.
          - repeat:
              for_each: "{{ notify_devices }}"
              sequence:
                - action: >-
                    notify.mobile_app_{{
                      device_attr(repeat.item, 'name') | slugify }}
                  data:
                    title: Car is unlocked away from home
                    message: "{{ unlocked_message }}"
                    data:
                      tag: !input notification_tag
                      channel: !input notification_channel
                      importance: !input notification_importance
                      notification_icon: !input notification_icon
                      clickAction: !input click_action
                      persistent: true
                      actions:
                        - action: !input lock_action_id
                          title: Lock
          - if:
              - condition: template
                value_template: "{{ notify_target | trim != '' }}"
            then:
              - action: !input notify_target
                data:
                  title: Car is unlocked away from home
                  message: "{{ unlocked_message }}"
                  data:
                    tag: !input notification_tag
                    channel: !input notification_channel
                    importance: !input notification_importance
                    notification_icon: !input notification_icon
                    clickAction: !input click_action
                    persistent: true
                    actions:
                      - action: !input lock_action_id
                        title: Lock
          - if:
              - condition: template
                value_template: "{{ also_persistent }}"
            then:
              - action: notify.persistent_notification
                data:
                  title: Car is unlocked away from home
                  message: "{{ unlocked_message }}"
          - if:
              - condition: template
                value_template: "{{ announce_tts }}"
            then:
              - action: !input notify_target
                data:
                  message: TTS
                  data:
                    tts_text: "{{ unlocked_message }}"
      - conditions:
          - condition: trigger
            id: unlocked_away
          - condition: not
            conditions:
              - condition: state
                entity_id: !input vehicle_tracker
                state: home
        sequence:
          - variables:
              reserve_message: >-
                The car has been away and unlocked for a while. The lock
                action was left off this notification because the API call
                reserve ({{ reserve_value }}) is protecting the remaining
                allowance.
          - repeat:
              for_each: "{{ notify_devices }}"
              sequence:
                - action: >-
                    notify.mobile_app_{{
                      device_attr(repeat.item, 'name') | slugify }}
                  data:
                    title: Car is unlocked away from home
                    message: "{{ reserve_message }}"
                    data:
                      tag: !input notification_tag
                      channel: !input notification_channel
                      importance: !input notification_importance
                      notification_icon: !input notification_icon
                      clickAction: !input click_action
                      persistent: true
          - if:
              - condition: template
                value_template: "{{ notify_target | trim != '' }}"
            then:
              - action: !input notify_target
                data:
                  title: Car is unlocked away from home
                  message: "{{ reserve_message }}"
                  data:
                    tag: !input notification_tag
                    channel: !input notification_channel
                    importance: !input notification_importance
                    notification_icon: !input notification_icon
                    clickAction: !input click_action
                    persistent: true
          - if:
              - condition: template
                value_template: "{{ also_persistent }}"
            then:
              - action: notify.persistent_notification
                data:
                  title: Car is unlocked away from home
                  message: "{{ reserve_message }}"
