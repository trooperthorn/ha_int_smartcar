blueprint:
  name: Smartcar - plug-in reminder
  description: >-
    Notifies you when the car comes home with a low battery and stays
    unplugged for a while, so it is not still low the next time you need it.


    Zero Smartcar API calls. The plug status and battery level are read from
    entities Home Assistant already has; nothing here asks Smartcar for
    anything. Smartcar data can be minutes to a day old between webhook
    pushes, so if the plug status still looks wrong after you have actually
    plugged in, call `smartcar.refresh_vehicle` (one billed call, or pass
    `force: true` if the reserve is otherwise protecting it) to confirm.
  domain: automation
  homeassistant:
    min_version: 2026.9.0
  input:
    vehicle_tracker:
      name: Vehicle location
      selector:
        entity:
          filter:
            - domain: device_tracker
              integration: smartcar
    battery:
      name: Battery level sensor
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: battery
    plug_status:
      name: Plug status
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: plug
    threshold:
      name: Notify below this battery level
      default: 50
      selector:
        number:
          min: 0
          max: 100
          step: 5
          unit_of_measurement: "%"
    settle:
      name: Unplugged for
      description: How long the car must sit home and unplugged before reminding.
      default:
        minutes: 30
      selector:
        duration: {}
    notify_target:
      name: Notify action
      default: notify.persistent_notification
      selector:
        text: {}
    refresh_action_id:
      name: Refresh status action ID
      description: >-
        The action ID sent with the "Refresh status" button. Must be unique
        per vehicle if this blueprint is used for more than one car.
      default: SMARTCAR_REFRESH
      selector:
        text: {}
    notification_tag:
      name: Notification tag
      description: >-
        A stable, per-vehicle tag so a repeat of this notification replaces
        the previous one instead of stacking. Use a different value per
        vehicle if this blueprint is used for more than one car.
      default: smartcar_plug_in_reminder
      selector:
        text: {}
    notification_channel:
      name: Notification channel
      default: Smartcar
      selector:
        text: {}
    notification_importance:
      name: Notification importance
      default: default
      selector:
        select:
          options:
            - min
            - low
            - default
            - high
            - max
    notification_icon:
      name: Notification icon
      default: "mdi:car-electric"
      selector:
        text: {}
    click_action:
      name: Click action
      description: >-
        Where tapping the notification body opens. A Home Assistant path
        such as "/config/devices/device/<id>" for the vehicle's device
        page, or "entityId:sensor.xxx" for an entity's more-info dialog.
        Leave blank for the default behavior.
      default: ""
      selector:
        text: {}

mode: single
max_exceptions: 0

triggers:
  - trigger: state
    id: unplugged_settled
    entity_id: !input plug_status
    to: "off"
    for: !input settle
  - trigger: state
    id: plugged_in
    entity_id: !input plug_status
    to: "on"

conditions: []

actions:
  - variables:
      battery_entity: !input battery
  - choose:
      - conditions:
          - condition: trigger
            id: plugged_in
        sequence:
          - action: !input notify_target
            data:
              message: clear_notification
              data:
                tag: !input notification_tag
      - conditions:
          - condition: trigger
            id: unplugged_settled
          - condition: state
            entity_id: !input vehicle_tracker
            state: home
          - condition: numeric_state
            entity_id: !input battery
            below: !input threshold
        sequence:
          - action: !input notify_target
            data:
              title: Car is home and not plugged in
              message: >-
                Battery is at {{ states(battery_entity) }}% and the car has
                been home and unplugged for a while.
              data:
                tag: !input notification_tag
                channel: !input notification_channel
                importance: !input notification_importance
                notification_icon: !input notification_icon
                clickAction: !input click_action
                actions:
                  - action: !input refresh_action_id
                    title: Refresh status
