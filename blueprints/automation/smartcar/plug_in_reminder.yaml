blueprint:
  name: Smartcar - plug-in reminder
  description: >-
    Notifies you when the car comes home with a low battery and stays
    unplugged for a while, so it is not still low the next time you need it.


    Zero Smartcar API calls. The plug status and battery level are read from
    entities Home Assistant already has; nothing here asks Smartcar for
    anything. Smartcar data can be minutes to a day old between webhook
    pushes, so if the plug status still looks wrong after you have actually
    plugged in, call `smartcar.refresh_vehicle` (one billed call, or pass
    `force: true` if the reserve is otherwise protecting it) to confirm.
  domain: automation
  homeassistant:
    min_version: 2026.9.0
  input:
    vehicle_tracker:
      name: Vehicle location
      selector:
        entity:
          filter:
            - domain: device_tracker
              integration: smartcar
    battery:
      name: Battery level sensor
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: battery
    plug_status:
      name: Plug status
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: plug
    threshold:
      name: Notify below this battery level
      default: 50
      selector:
        number:
          min: 0
          max: 100
          step: 5
          unit_of_measurement: "%"
    settle:
      name: Unplugged for
      description: How long the car must sit home and unplugged before reminding.
      default:
        minutes: 30
      selector:
        duration: {}
    notify_target:
      name: Notify action (deprecated)
      description: >-
        Optional legacy notify action, for example notify.mobile_app_phone.
        Still called if set, for existing automations. New setups should use
        Notify devices below instead.
      default: ""
      selector:
        text: {}
    notify_devices:
      name: Notify devices
      description: >-
        Mobile app devices to notify. Each device's notify action is derived
        as notify.mobile_app_<device name, slugified>.
      default: []
      selector:
        device:
          filter:
            - integration: mobile_app
          multiple: true
    also_persistent:
      name: Also create a persistent notification
      description: >-
        In addition to the devices above, also raises a persistent_notification
        with the same title and message. On by default so a fresh import
        behaves like the old default of notify.persistent_notification did.
      default: true
      selector:
        boolean: {}
    refresh_action_id:
      name: Refresh status action ID
      description: >-
        The action ID sent with the "Refresh status" button. Must be unique
        per vehicle if this blueprint is used for more than one car.
      default: SMARTCAR_REFRESH
      selector:
        text: {}
    notification_tag:
      name: Notification tag
      description: >-
        A stable, per-vehicle tag so a repeat of this notification replaces
        the previous one instead of stacking. Use a different value per
        vehicle if this blueprint is used for more than one car.
      default: smartcar_plug_in_reminder
      selector:
        text: {}
    notification_channel:
      name: Notification channel
      default: Smartcar
      selector:
        text: {}
    notification_importance:
      name: Notification importance
      default: default
      selector:
        select:
          options:
            - min
            - low
            - default
            - high
            - max
    notification_icon:
      name: Notification icon
      default: "mdi:car-electric"
      selector:
        text: {}
    click_action:
      name: Click action
      description: >-
        Where tapping the notification body opens. A Home Assistant path
        such as "/config/devices/device/<id>" for the vehicle's device
        page, or "entityId:sensor.xxx" for an entity's more-info dialog.
        Leave blank for the default behavior.
      default: ""
      selector:
        text: {}
    open_app_package:
      name: Vehicle app package (optional)
      description: >-
        When set, adds an "Open app" action that opens this Android package
        via an app:// URI, per the Companion app's actionable-notification
        URI forms.
      default: ""
      selector:
        text: {}

mode: single
max_exceptions: 0

triggers:
  - trigger: state
    id: unplugged_settled
    entity_id: !input plug_status
    to: "off"
    for: !input settle
  - trigger: state
    id: plugged_in
    entity_id: !input plug_status
    to: "on"

conditions: []

actions:
  - variables:
      battery_entity: !input battery
      notify_target: !input notify_target
      notify_devices: !input notify_devices
      also_persistent: !input also_persistent
      open_app_package: !input open_app_package
      refresh_action_id_value: !input refresh_action_id
  - choose:
      - conditions:
          - condition: trigger
            id: plugged_in
        sequence:
          - repeat:
              for_each: "{{ notify_devices }}"
              sequence:
                - action: >-
                    notify.mobile_app_{{
                      device_attr(repeat.item, 'name') | slugify }}
                  data:
                    message: clear_notification
                    data:
                      tag: !input notification_tag
          - if:
              - condition: template
                value_template: "{{ notify_target | trim != '' }}"
            then:
              - action: !input notify_target
                data:
                  message: clear_notification
                  data:
                    tag: !input notification_tag
      - conditions:
          - condition: trigger
            id: unplugged_settled
          - condition: state
            entity_id: !input vehicle_tracker
            state: home
          - condition: numeric_state
            entity_id: !input battery
            below: !input threshold
        sequence:
          - variables:
              notify_title: Car is home and not plugged in
              notify_message: >-
                Battery is at {{ states(battery_entity) }}% and the car has
                been home and unplugged for a while.
              notify_actions: >-
                {{ [{'action': refresh_action_id_value,
                     'title': 'Refresh status'}]
                   + ([{'action': 'URI', 'title': 'Open app',
                        'uri': 'app://' ~ open_app_package}]
                      if open_app_package | trim != '' else []) }}
          - repeat:
              for_each: "{{ notify_devices }}"
              sequence:
                - action: >-
                    notify.mobile_app_{{
                      device_attr(repeat.item, 'name') | slugify }}
                  data:
                    title: "{{ notify_title }}"
                    message: "{{ notify_message }}"
                    data:
                      tag: !input notification_tag
                      channel: !input notification_channel
                      importance: !input notification_importance
                      notification_icon: !input notification_icon
                      clickAction: !input click_action
                      actions: "{{ notify_actions }}"
          - if:
              - condition: template
                value_template: "{{ notify_target | trim != '' }}"
            then:
              - action: !input notify_target
                data:
                  title: "{{ notify_title }}"
                  message: "{{ notify_message }}"
                  data:
                    tag: !input notification_tag
                    channel: !input notification_channel
                    importance: !input notification_importance
                    notification_icon: !input notification_icon
                    clickAction: !input click_action
                    actions: "{{ notify_actions }}"
          - if:
              - condition: template
                value_template: "{{ also_persistent }}"
            then:
              - action: notify.persistent_notification
                data:
                  title: "{{ notify_title }}"
                  message: "{{ notify_message }}"
