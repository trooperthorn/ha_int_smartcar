blueprint:
  name: Smartcar - warn before the monthly API allowance runs out
  description: >-
    Notifies you when a vehicle has spent most of its Smartcar API allowance
    for the month.


    Running out matters more than it sounds: commands are billed from the same
    allowance, so an exhausted budget is a lock or a charge stop that cannot be
    sent. The integration keeps a reserve back for exactly that reason, and
    this warns you before the reserve is all that is left.
  domain: automation
  homeassistant:
    min_version: 2026.9.0
  input:
    remaining:
      name: API calls remaining sensor
      selector:
        entity:
          filter:
            - domain: sensor
              integration: smartcar
    threshold:
      name: Warn below
      default: 100
      selector:
        number:
          min: 10
          max: 400
          step: 10
    notify_target:
      name: Notify action (deprecated)
      description: >-
        Optional legacy notify action, for example notify.mobile_app_phone.
        Still called if set, for existing automations. New setups should use
        Notify devices below instead.
      default: ""
      selector:
        text: {}
    notify_devices:
      name: Notify devices
      description: >-
        Mobile app devices to notify. Each device's notify action is derived
        as notify.mobile_app_<device name, slugified>.
      default: []
      selector:
        device:
          filter:
            - integration: mobile_app
          multiple: true
    also_persistent:
      name: Also create a persistent notification
      description: >-
        In addition to the devices above, also raises a persistent_notification
        with the same title and message. On by default so a fresh import
        behaves like the old default of notify.persistent_notification did.
      default: true
      selector:
        boolean: {}
    notification_tag:
      name: Notification tag
      description: >-
        A stable, per-vehicle tag so a repeat of this notification replaces
        the previous one instead of stacking. Use a different value per
        vehicle if this blueprint is used for more than one car.
      default: smartcar_api_budget
      selector:
        text: {}
    notification_channel:
      name: Notification channel
      default: Smartcar
      selector:
        text: {}
    notification_importance:
      name: Notification importance
      default: default
      selector:
        select:
          options:
            - min
            - low
            - default
            - high
            - max
    notification_icon:
      name: Notification icon
      default: "mdi:car-electric"
      selector:
        text: {}
    click_action:
      name: Click action
      description: >-
        Where tapping the notification body opens. A Home Assistant path
        such as "/config/devices/device/<id>" for the vehicle's device
        page, or "entityId:sensor.xxx" for an entity's more-info dialog.
        Leave blank for the default behavior.
      default: ""
      selector:
        text: {}

mode: single

triggers:
  - trigger: numeric_state
    id: low
    entity_id: !input remaining
    below: !input threshold
  - trigger: numeric_state
    id: recovered
    entity_id: !input remaining
    above: !input threshold

conditions: []

actions:
  - variables:
      notify_target: !input notify_target
      notify_devices: !input notify_devices
      also_persistent: !input also_persistent
  - if:
      - condition: trigger
        id: recovered
    then:
      - repeat:
          for_each: "{{ notify_devices }}"
          sequence:
            - action: >-
                notify.mobile_app_{{
                  device_attr(repeat.item, 'name') | slugify }}
              data:
                message: clear_notification
                data:
                  tag: !input notification_tag
      - if:
          - condition: template
            value_template: "{{ notify_target | trim != '' }}"
        then:
          - action: !input notify_target
            data:
              message: clear_notification
              data:
                tag: !input notification_tag
      - if:
          - condition: template
            value_template: "{{ also_persistent }}"
        then:
          - action: persistent_notification.dismiss
            data:
              notification_id: !input notification_tag
    else:
      - variables:
          notify_title: Smartcar API allowance is running low
          notify_message: >-
            {{ trigger.to_state.name }} is down to
            {{ trigger.to_state.state }} calls for
            {{ trigger.to_state.attributes.get('period', 'this period') }}.
            {{ trigger.to_state.attributes.get('reserved_for_commands', 0) }}
            are reserved for commands. Subscribing the vehicle to a
            Smartcar webhook gives updates that do not spend the allowance
            at all.
      - repeat:
          for_each: "{{ notify_devices }}"
          sequence:
            - action: >-
                notify.mobile_app_{{
                  device_attr(repeat.item, 'name') | slugify }}
              data:
                title: "{{ notify_title }}"
                message: "{{ notify_message }}"
                data:
                  tag: !input notification_tag
                  channel: !input notification_channel
                  importance: !input notification_importance
                  notification_icon: !input notification_icon
                  clickAction: !input click_action
      - if:
          - condition: template
            value_template: "{{ notify_target | trim != '' }}"
        then:
          - action: !input notify_target
            data:
              title: "{{ notify_title }}"
              message: "{{ notify_message }}"
              data:
                tag: !input notification_tag
                channel: !input notification_channel
                importance: !input notification_importance
                notification_icon: !input notification_icon
                clickAction: !input click_action
      - if:
          - condition: template
            value_template: "{{ also_persistent }}"
        then:
          - action: notify.persistent_notification
            data:
              title: "{{ notify_title }}"
              message: "{{ notify_message }}"
              data:
                notification_id: !input notification_tag
