blueprint:
  name: Smartcar - low range warning
  description: >-
    Notifies when the range drops below a threshold, either at a fixed
    evening time or whenever the car leaves home, and includes the nearest
    upcoming calendar trip if one has a location.


    Zero Smartcar API calls: it reacts to the range sensor and reads the
    calendar directly, both of which are free. Smartcar range data can be
    minutes to a day old, so a warning right after driving may lag reality;
    call `smartcar.refresh_vehicle` (one billed call) to force a fresh
    reading before trusting a number that matters.
  domain: automation
  homeassistant:
    min_version: 2026.9.0
  input:
    range_sensor:
      name: Range sensor
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: distance
    threshold:
      name: Warn below this range
      default: 40
      selector:
        number:
          min: 0
          max: 500
          step: 5
          unit_of_measurement: km
    vehicle_tracker:
      name: Vehicle location
      description: Also triggers a check whenever the car leaves home.
      selector:
        entity:
          filter:
            - domain: device_tracker
              integration: smartcar
    evening_time:
      name: Evening check time
      default: "18:00:00"
      selector:
        time: {}
    calendar:
      name: Calendar
      description: Optional. Its nearest upcoming located event is included.
      default: ""
      selector:
        entity:
          filter:
            - domain: calendar
    notify_target:
      name: Notify action (deprecated)
      description: >-
        Optional legacy notify action, for example notify.mobile_app_phone.
        Still called if set, for existing automations. New setups should use
        Notify devices below instead.
      default: ""
      selector:
        text: {}
    notify_devices:
      name: Notify devices
      description: >-
        Mobile app devices to notify. Each device's notify action is derived
        as notify.mobile_app_<device name, slugified>.
      default: []
      selector:
        device:
          filter:
            - integration: mobile_app
          multiple: true
    also_persistent:
      name: Also create a persistent notification
      description: >-
        In addition to the devices above, also raises a persistent_notification
        with the same title and message. On by default so a fresh import
        behaves like the old default of notify.persistent_notification did.
      default: true
      selector:
        boolean: {}
    notification_tag:
      name: Notification tag
      description: >-
        A stable, per-vehicle tag so a repeat of this notification replaces
        the previous one instead of stacking. Use a different value per
        vehicle if this blueprint is used for more than one car.
      default: smartcar_low_range
      selector:
        text: {}
    notification_channel:
      name: Notification channel
      default: Smartcar
      selector:
        text: {}
    notification_importance:
      name: Notification importance
      default: high
      selector:
        select:
          options:
            - min
            - low
            - default
            - high
            - max
    notification_icon:
      name: Notification icon
      default: "mdi:car-electric"
      selector:
        text: {}
    click_action:
      name: Click action
      description: >-
        Where tapping the notification body opens. A Home Assistant path
        such as "/config/devices/device/<id>" for the vehicle's device
        page, or "entityId:sensor.xxx" for an entity's more-info dialog.
        Leave blank for the default behavior.
      default: ""
      selector:
        text: {}
    announce_tts:
      name: Also announce with text-to-speech
      description: >-
        When on, also sends the notification text to the same notify
        action as a spoken TTS command, in addition to the normal
        notification.
      default: false
      selector:
        boolean: {}

mode: single
max_exceptions: 0

triggers:
  - trigger: time
    id: check
    at: !input evening_time
  - trigger: state
    id: check
    entity_id: !input vehicle_tracker
    from: home
  - trigger: numeric_state
    id: recovered
    entity_id: !input range_sensor
    above: !input threshold

conditions: []

actions:
  - variables:
      notify_target: !input notify_target
      notify_devices: !input notify_devices
      also_persistent: !input also_persistent
  - if:
      - condition: trigger
        id: recovered
    then:
      - repeat:
          for_each: "{{ notify_devices }}"
          sequence:
            - action: >-
                notify.mobile_app_{{
                  device_attr(repeat.item, 'name') | slugify }}
              data:
                message: clear_notification
                data:
                  tag: !input notification_tag
      - if:
          - condition: template
            value_template: "{{ notify_target | trim != '' }}"
        then:
          - action: !input notify_target
            data:
              message: clear_notification
              data:
                tag: !input notification_tag
    else:
      - if:
          - condition: numeric_state
            entity_id: !input range_sensor
            below: !input threshold
        then:
          - variables:
              range_entity: !input range_sensor
              calendar_entity: !input calendar
              announce_tts: !input announce_tts
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ calendar_entity not in ['', none] }}"
                sequence:
                  - action: calendar.get_events
                    target:
                      entity_id: "{{ calendar_entity }}"
                    data:
                      duration:
                        hours: 72
                    response_variable: upcoming
            default:
              - variables:
                  upcoming:
                    "{{ calendar_entity }}":
                      events: []
          - variables:
              next_event: >-
                {{ (upcoming[calendar_entity].events | default([]))[0]
                   if calendar_entity not in ['', none]
                      and (upcoming[calendar_entity].events
                           | default([]) | count) > 0
                   else none }}
              range_message: >-
                {{ states(range_entity) }}
                {{ state_attr(range_entity, 'unit_of_measurement') }} of
                range left.
                {{ ('Next trip: ' ~ next_event.summary ~ ' to '
                    ~ next_event.location)
                   if next_event is not none and next_event.location
                   else '' }}
          - repeat:
              for_each: "{{ notify_devices }}"
              sequence:
                - action: >-
                    notify.mobile_app_{{
                      device_attr(repeat.item, 'name') | slugify }}
                  data:
                    title: Range is low
                    message: "{{ range_message }}"
                    data:
                      tag: !input notification_tag
                      channel: !input notification_channel
                      importance: !input notification_importance
                      notification_icon: !input notification_icon
                      clickAction: !input click_action
          - if:
              - condition: template
                value_template: "{{ notify_target | trim != '' }}"
            then:
              - action: !input notify_target
                data:
                  title: Range is low
                  message: "{{ range_message }}"
                  data:
                    tag: !input notification_tag
                    channel: !input notification_channel
                    importance: !input notification_importance
                    notification_icon: !input notification_icon
                    clickAction: !input click_action
          - if:
              - condition: template
                value_template: "{{ also_persistent }}"
            then:
              - action: notify.persistent_notification
                data:
                  title: Range is low
                  message: "{{ range_message }}"
          - if:
              - condition: template
                value_template: "{{ announce_tts }}"
            then:
              - action: !input notify_target
                data:
                  message: TTS
                  data:
                    tts_text: "{{ range_message }}"
