blueprint:
  name: Smartcar - charge for a round trip now
  description: >-
    On-demand version: fires from a mobile_app notification action, or run it
    directly from the automation's own "Run" button, to compute the charge
    needed for one destination and start charging to that limit right away.


    This calls the "Smartcar - charge for a round trip" script blueprint to
    do the actual computation and commands, so see that blueprint's
    description for the exact API cost (zero reads, up to two commands, only
    when a command is actually needed).
  domain: automation
  homeassistant:
    min_version: 2026.9.0
  input:
    destination:
      name: Destination
      selector:
        text: {}
    charge_script:
      name: "Charge for a round trip script"
      description: >-
        The entity_id of the "Smartcar - charge for a round trip" script
        created from that blueprint.
      selector:
        entity:
          filter:
            - domain: script
    notification_action_id:
      name: Notification action ID
      description: >-
        The action ID a notification's action button carries. Send a
        notification elsewhere with an action of this ID (for example
        "Set limit to X" from the trip-check blueprint) to fire this
        automation from it.
      default: SMARTCAR_CHARGE_FOR_TRIP
      selector:
        text: {}
    reply_action_id:
      name: "Charge-to reply action ID"
      description: >-
        The action ID of the "Charge to..." reply action. Must match the
        same input on the "Smartcar - check tomorrow's trips against range"
        blueprint's notification for its reply text to reach this
        automation.
      default: SMARTCAR_REPLY_CHARGE_TO
      selector:
        text: {}
    charge_limit:
      name: Charge limit number
      description: >-
        Set directly from the reply's typed percentage, clamped to 50-100,
        instead of going through the charge script.
      selector:
        entity:
          filter:
            - domain: number
              integration: smartcar

mode: queued
max: 3
max_exceptions: 0

triggers:
  - trigger: event
    id: run_trip
    event_type: mobile_app_notification_action
    event_data:
      action: !input notification_action_id
  - trigger: event
    id: reply_charge_to
    event_type: mobile_app_notification_action
    event_data:
      action: !input reply_action_id

conditions: []

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: reply_charge_to
        sequence:
          - variables:
              reply_percent: >-
                {{ [[trigger.event.data.reply_text | int(0), 50] | max, 100]
                   | min }}
          - action: number.set_value
            target:
              entity_id: !input charge_limit
            data:
              value: "{{ reply_percent }}"
            continue_on_error: true
    default:
      - action: !input charge_script
        data:
          destination: !input destination
        continue_on_error: true
