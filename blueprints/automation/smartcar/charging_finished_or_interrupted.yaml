blueprint:
  name: Smartcar - charging finished or interrupted
  description: >-
    Notifies when charging stops, and says whether it stopped because it
    finished or because it was interrupted below the charge limit.


    Zero Smartcar API calls. This watches the charging switch and the charge
    limit number, entities that are already populated by webhook or by
    whatever polling profile is configured, and reacts to their state
    changes rather than asking Smartcar anything new. Smartcar data can be
    minutes to a day old between updates, so a very short charging session
    may be missed entirely if it starts and stops between refreshes; that is
    a limitation of the data source, not of this automation.
  domain: automation
  homeassistant:
    min_version: 2026.9.0
  input:
    charging_switch:
      name: Charging switch
      selector:
        entity:
          filter:
            - domain: switch
              integration: smartcar
    battery:
      name: Battery level sensor
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: battery
    range_sensor:
      name: Range sensor
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: distance
    charge_limit:
      name: Charge limit number
      description: Used to tell "finished" apart from "interrupted".
      selector:
        entity:
          filter:
            - domain: number
              integration: smartcar
    notify_target:
      name: Notify action
      default: notify.persistent_notification
      selector:
        text: {}
    notification_tag:
      name: Notification tag
      description: >-
        A stable, per-vehicle tag so a repeat of this notification replaces
        the previous one instead of stacking. Use a different value per
        vehicle if this blueprint is used for more than one car.
      default: smartcar_charging_status
      selector:
        text: {}
    notification_channel:
      name: Notification channel
      default: Smartcar
      selector:
        text: {}
    notification_importance:
      name: Notification importance
      default: default
      selector:
        select:
          options:
            - min
            - low
            - default
            - high
            - max
    notification_icon:
      name: Notification icon
      default: "mdi:car-electric"
      selector:
        text: {}
    click_action:
      name: Click action
      description: >-
        Where tapping the notification body opens. A Home Assistant path
        such as "/config/devices/device/<id>" for the vehicle's device
        page, or "entityId:sensor.xxx" for an entity's more-info dialog.
        Leave blank for the default behavior.
      default: ""
      selector:
        text: {}

mode: single
max_exceptions: 0

triggers:
  - trigger: state
    id: charging_stopped
    entity_id: !input charging_switch
    from: "on"
    to: "off"
  - trigger: state
    id: charging_started
    entity_id: !input charging_switch
    to: "on"

conditions: []

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: charging_started
        sequence:
          - action: !input notify_target
            data:
              message: clear_notification
              data:
                tag: !input notification_tag
      - conditions:
          - condition: trigger
            id: charging_stopped
        sequence:
          - variables:
              battery_entity: !input battery
              range_entity: !input range_sensor
              limit_entity: !input charge_limit
              battery_value: "{{ states(battery_entity) | float(0) }}"
              limit_value: "{{ states(limit_entity) | float(100) }}"
              finished: "{{ battery_value >= (limit_value - 1) }}"
          - action: !input notify_target
            data:
              title: >-
                {{ 'Charging finished' if finished else
                   'Charging stopped early' }}
              message: >-
                Battery is at {{ battery_value | round(0) }}% with
                {{ states(range_entity) }}
                {{ state_attr(range_entity, 'unit_of_measurement') }} of
                range.
                {% if not finished %}
                This is below the {{ limit_value | round(0) }}% charge
                limit, so charging was interrupted rather than completed.
                {% endif %}
              data:
                tag: !input notification_tag
                channel: !input notification_channel
                importance: !input notification_importance
                notification_icon: !input notification_icon
                clickAction: !input click_action
