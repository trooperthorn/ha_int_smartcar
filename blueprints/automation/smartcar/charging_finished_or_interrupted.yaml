blueprint:
  name: Smartcar - charging finished or interrupted
  description: >-
    Notifies when charging stops, and says whether it stopped because it
    finished or because it was interrupted below the charge limit.


    Zero Smartcar API calls. This watches the charging switch and the charge
    limit number, entities that are already populated by webhook or by
    whatever polling profile is configured, and reacts to their state
    changes rather than asking Smartcar anything new. Smartcar data can be
    minutes to a day old between updates, so a very short charging session
    may be missed entirely if it starts and stops between refreshes; that is
    a limitation of the data source, not of this automation.
  domain: automation
  homeassistant:
    min_version: 2026.9.0
  input:
    charging_switch:
      name: Charging switch
      selector:
        entity:
          filter:
            - domain: switch
              integration: smartcar
    battery:
      name: Battery level sensor
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: battery
    range_sensor:
      name: Range sensor
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: distance
    charge_limit:
      name: Charge limit number
      description: Used to tell "finished" apart from "interrupted".
      selector:
        entity:
          filter:
            - domain: number
              integration: smartcar
    notify_target:
      name: Notify action (deprecated)
      description: >-
        Optional legacy notify action, for example notify.mobile_app_phone.
        Still called if set, for existing automations. New setups should use
        Notify devices below instead.
      default: ""
      selector:
        text: {}
    notify_devices:
      name: Notify devices
      description: >-
        Mobile app devices to notify. Each device's notify action is derived
        as notify.mobile_app_<device name, slugified>.
      default: []
      selector:
        device:
          filter:
            - integration: mobile_app
          multiple: true
    also_persistent:
      name: Also create a persistent notification
      description: >-
        In addition to the devices above, also raises a persistent_notification
        with the same title and message. On by default so a fresh import
        behaves like the old default of notify.persistent_notification did.
      default: true
      selector:
        boolean: {}
    notification_tag:
      name: Notification tag
      description: >-
        A stable, per-vehicle tag so a repeat of this notification replaces
        the previous one instead of stacking. Use a different value per
        vehicle if this blueprint is used for more than one car.
      default: smartcar_charging_status
      selector:
        text: {}
    notification_channel:
      name: Notification channel
      default: Smartcar
      selector:
        text: {}
    notification_importance:
      name: Notification importance
      default: default
      selector:
        select:
          options:
            - min
            - low
            - default
            - high
            - max
    notification_icon:
      name: Notification icon
      default: "mdi:car-electric"
      selector:
        text: {}
    click_action:
      name: Click action
      description: >-
        Where tapping the notification body opens. A Home Assistant path
        such as "/config/devices/device/<id>" for the vehicle's device
        page, or "entityId:sensor.xxx" for an entity's more-info dialog.
        Leave blank for the default behavior.
      default: ""
      selector:
        text: {}
    open_app_package:
      name: Vehicle app package (optional)
      description: >-
        When set, adds an "Open app" action that opens this Android package
        via an app:// URI, per the Companion app's actionable-notification
        URI forms.
      default: ""
      selector:
        text: {}

mode: single
max_exceptions: 0

triggers:
  - trigger: state
    id: charging_stopped
    entity_id: !input charging_switch
    from: "on"
    to: "off"
  - trigger: state
    id: charging_started
    entity_id: !input charging_switch
    to: "on"

conditions: []

actions:
  - variables:
      notify_target: !input notify_target
      notify_devices: !input notify_devices
      also_persistent: !input also_persistent
      open_app_package: !input open_app_package
  - choose:
      - conditions:
          - condition: trigger
            id: charging_started
        sequence:
          - repeat:
              for_each: "{{ notify_devices }}"
              sequence:
                - action: >-
                    notify.mobile_app_{{
                      device_attr(repeat.item, 'name') | slugify }}
                  data:
                    message: clear_notification
                    data:
                      tag: !input notification_tag
          - if:
              - condition: template
                value_template: "{{ notify_target | trim != '' }}"
            then:
              - action: !input notify_target
                data:
                  message: clear_notification
                  data:
                    tag: !input notification_tag
      - conditions:
          - condition: trigger
            id: charging_stopped
        sequence:
          - variables:
              battery_entity: !input battery
              range_entity: !input range_sensor
              limit_entity: !input charge_limit
              battery_value: "{{ states(battery_entity) | float(0) }}"
              limit_value: "{{ states(limit_entity) | float(100) }}"
              finished: "{{ battery_value >= (limit_value - 1) }}"
          - variables:
              notify_title: >-
                {{ 'Charging finished' if finished else
                   'Charging stopped early' }}
              notify_message: >-
                Battery is at {{ battery_value | round(0) }}% with
                {{ states(range_entity) }}
                {{ state_attr(range_entity, 'unit_of_measurement') }} of
                range.
                {% if not finished %}
                This is below the {{ limit_value | round(0) }}% charge
                limit, so charging was interrupted rather than completed.
                {% endif %}
              notify_actions: >-
                {{ [{'action': 'URI', 'title': 'Open app',
                     'uri': 'app://' ~ open_app_package}]
                   if open_app_package | trim != '' else [] }}
          - repeat:
              for_each: "{{ notify_devices }}"
              sequence:
                - action: >-
                    notify.mobile_app_{{
                      device_attr(repeat.item, 'name') | slugify }}
                  data:
                    title: "{{ notify_title }}"
                    message: "{{ notify_message }}"
                    data:
                      tag: !input notification_tag
                      channel: !input notification_channel
                      importance: !input notification_importance
                      notification_icon: !input notification_icon
                      clickAction: !input click_action
                      actions: "{{ notify_actions }}"
          - if:
              - condition: template
                value_template: "{{ notify_target | trim != '' }}"
            then:
              - action: !input notify_target
                data:
                  title: "{{ notify_title }}"
                  message: "{{ notify_message }}"
                  data:
                    tag: !input notification_tag
                    channel: !input notification_channel
                    importance: !input notification_importance
                    notification_icon: !input notification_icon
                    clickAction: !input click_action
                    actions: "{{ notify_actions }}"
          - if:
              - condition: template
                value_template: "{{ also_persistent }}"
            then:
              - action: notify.persistent_notification
                data:
                  title: "{{ notify_title }}"
                  message: "{{ notify_message }}"
