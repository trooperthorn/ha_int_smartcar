repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-yaml
        args: [--unsafe]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude_types: [markdown]
      - id: check-executables-have-shebangs
      - id: no-commit-to-branch
        args:
          - --branch=main
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1
    hooks:
      - id: yamllint
        args:
          - >
            --config-data={
              extends: default,
              rules: {
                anchors: disable,
                document-start: disable,
                comments: { min-spaces-from-content: 1 },
                line-length: { max: 88 },
                indentation: { indent-sequences: consistent },
                truthy: { check-keys: false },
              }
            }
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=hass
          - --skip="./.*,*.csv,*.json"
          - --quiet-level=2
        exclude_types: [csv, json]
  # mypy runs from the environment rather than an isolated one on purpose. The
  # isolated hook had no homeassistant installed, so every framework import
  # resolved to Any and the type check could not see a single Home Assistant
  # API. The quality scale's strict-typing rule is meaningless under those
  # conditions, so this runs where the dependencies actually are.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        types_or: [python, pyi]
        require_serial: true
        # the integration only, which is the scope the quality scale's
        # strict-typing rule covers and the scope core applies these flags to.
        files: ^custom_components/
        args:
          - --pretty
          - --show-error-codes
          - --show-error-context
